<!DOCTYPE html>
<html>
<head>
    <title>Encuesta</title>
</head>
<body>
    <h2>Encuesta Rápida</h2>
    <form>
        <p>¿Cuál es tu nivel de HTML?</p>
        <input type="radio" id="principiante" name="nivel" value="principiante">
        <label for="principiante">Principiante</label><br>
        <input type="radio" id="intermedio" name="nivel" value="intermedio">
        <label for="intermedio">Intermedio</label><br><br>

        <label for="pais">Selecciona tu país:</label>
        <select id="pais" name="pais">
            <option value="es">España</option>
            <option value="mx">México</option>
            <option value="co">Colombia</option>
            <option value="ar">Argentina</option>
            <option value="sv">El Salvador</option>
            <option value="gt">Guatemala</option>
            <option value="cl">Chile</option>
            <option value="pe">Perú</option>
        </select>
    </form>
</body>
    <p><a href="index.html">← Volver al menú</a></p>
</html>
